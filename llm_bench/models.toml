# Modelli da confrontare come "cervello" del tutor, tutti via endpoint OpenAI-compatible.
# IMPORTANTE: il "thinking" va spento (extra_body = reasoning_effort "none", è anche il default del runner),
# altrimenti il ragionamento consuma max_tokens e le risposte arrivano troncate o vuote.
# Con 36 GB serve UN solo modello in memoria alla volta: prima di cambiare server fermalo
# (`ollama stop <modello>` oppure Ctrl+C su `splash serve`).

# --- Ollama (porta 11434). Controlla i tag con `ollama list`. ---
[models.gemma4_26b_a4b]          # MoE, ~4B attivi: candidato principale per la velocità
base_url = "http://localhost:11434/v1"
model = "gemma4:26b"

[models.gemma4_31b]              # denso: più accurato, più lento (tag da verificare)
base_url = "http://localhost:11434/v1"
model = "gemma4:31b"

[models.gemma4_e4b]              # baseline piccola e veloce (tag da verificare)
base_url = "http://localhost:11434/v1"
model = "gemma4:e4b"

# --- Splash (porta 8000, un modello alla volta). Le versioni recenti servono direttamente checkpoint MLX:
#     splash serve --model mlx-community/Qwen3.6-35B-A3B-4bit --max-context 32K
#     splash serve --model mlx-community/Qwen3.8-27B-4bit --max-context 32K     (verifica con `splash serve --help`)
# Consigli per i 36 GB (da provare): --max-context basso (il tutor usa prompt corti) e --max-memory per lasciare
# spazio a Whisper e al resto del sistema. Sui MoE l'output a temperatura 0 può variare da run a run (lo dice Splash).
[models.qwen36_35b_a3b_splash]   # MoE: già verificato che parte sul tuo Mac
base_url = "http://127.0.0.1:8000/v1"
model = "mlx-community/Qwen3.6-35B-A3B-4bit"
json_mode = false                # Splash documenta JSON Schema, non json_object: il parser del tutor è tollerante

[models.qwen38_27b_splash]       # denso
base_url = "http://127.0.0.1:8000/v1"
model = "mlx-community/Qwen3.8-27B-4bit"
json_mode = false
# extra_body = { reasoning_effort = "low" }   # prova anche questo: più qualità, un po' più di latenza
